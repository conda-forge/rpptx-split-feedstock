conda_build_tool: rattler-build
bot:
  version_updates:
    sources:
    - github
    # The repository also publishes the other package family's tags.
    allowed_tag_globs:
    - rpptx-v*
github:
  branch_name: main
  tooling_branch_name: main
conda_build:
  error_overlinking: true
conda_forge_output_validation: true
build_platform:
  linux_aarch64: linux_64
  osx_arm64: osx_64
test: native_and_emulated
